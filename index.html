<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="加泰语">
<title>加泰罗尼亚语</title>
<style>
/* El mateix disseny que «Xinès a Xangai»: un mapa de metro. Cada dia és una línia de parades
   i la setmana, una línia d'estacions. Sense fonts externes: a la Xina Google Fonts no carrega. */
:root {
  --paper: #eef2f1; --surface: #ffffff; --surface-2: #e3e9e7;
  --ink: #141a1c; --ink-2: #455256; --muted: #6c787c;
  --line: #d3dbd9; --line-strong: #a9b5b2;
  --seal: #c41e2e; --on-seal: #ffffff;
  --done: #127e66; --on-done: #ffffff; --done-soft: #d3ece4;
  --heat-0: #dde4e2; --heat-1: #b3dccd; --heat-2: #73bfa5; --heat-3: #2f977a; --heat-4: #0f6a53; --on-heat-4: #ffffff;
  --focus: #1f3fd6;
  --f-display: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", "PingFang SC", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1415; --surface: #172022; --surface-2: #1f292b;
    --ink: #e8eeec; --ink-2: #b2bec0; --muted: #8b979a;
    --line: #273234; --line-strong: #3e4c4f;
    --seal: #e5484f; --on-seal: #ffffff;
    --done: #35bd95; --on-done: #07201a; --done-soft: #163a31;
    --heat-0: #212a2c; --heat-1: #1b463b; --heat-2: #1f6b55; --heat-3: #2a9674; --heat-4: #4cc9a0; --on-heat-4: #07201a;
    --focus: #8aa5ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1415; --surface: #172022; --surface-2: #1f292b;
  --ink: #e8eeec; --ink-2: #b2bec0; --muted: #8b979a;
  --line: #273234; --line-strong: #3e4c4f;
  --seal: #e5484f; --on-seal: #ffffff;
  --done: #35bd95; --on-done: #07201a; --done-soft: #163a31;
  --heat-0: #212a2c; --heat-1: #1b463b; --heat-2: #1f6b55; --heat-3: #2a9674; --heat-4: #4cc9a0; --on-heat-4: #07201a;
  --focus: #8aa5ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); }
.vista { display: grid; gap: 18px; }
.zh { font-family: var(--f-zh); }
.ca { font-family: var(--f-body); }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.estat { font-size: 14px; color: var(--muted); }

/* Capçalera del dia */
.cap { display: grid; gap: 6px; }
.cap-nav { display: flex; align-items: center; gap: 8px; }
.cap-nav .eyebrow { flex: 1; min-width: 0; text-align: center; }
.icona-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 22px; line-height: 1; padding: 0; }
.icona-btn:disabled { opacity: .35; cursor: default; }
.cap-titol { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; }
.cap h1 { font-size: 40px; line-height: 1.05; }
.cap .meta { color: var(--muted); font-size: 15px; }
.segell { width: 62px; height: 62px; background: var(--seal); color: var(--on-seal); font-family: var(--f-zh); font-weight: 700; font-size: 21px; display: grid; place-items: center; border-radius: 7px; transform: rotate(-8deg); box-shadow: inset 0 0 0 3px var(--seal), inset 0 0 0 5px var(--on-seal); }
.segell.estampa { animation: estampa .45s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes estampa { from { transform: rotate(-8deg) scale(1.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .segell.estampa { animation: none; } }
.barra { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.barra span { height: 6px; border-radius: 3px; background: var(--line); }
.barra span.fet { background: var(--done); }

/* La ruta del dia */
.ruta { list-style: none; margin: 0; padding: 0; }
.parada { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; padding-bottom: 28px; }
.parada::before { content: ""; position: absolute; left: 18px; top: 40px; bottom: 0; width: 4px; border-radius: 2px; background: var(--line-strong); }
.parada:last-child { padding-bottom: 4px; }
.parada:last-child::before { display: none; }
.parada.fet::before { background: var(--done); }
.punt { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--line-strong); background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; }
.punt svg { width: 18px; height: 18px; }
.parada.fet .punt { background: var(--done); border-color: var(--done); color: var(--on-done); }
.parada-cos { min-width: 0; display: grid; gap: 10px; padding-top: 5px; }
.parada-cap { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.parada-cap h2 { font-size: 25px; line-height: 1.1; }
.min { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.parada-cos > p { color: var(--ink-2); }
audio { width: 100%; height: 42px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn.primari { background: var(--seal); border-color: var(--seal); color: var(--on-seal); }
.btn.toggle { justify-content: flex-start; text-align: left; }
.btn.toggle::before { content: ""; flex: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line-strong); }
.btn.toggle[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); }
.btn.toggle[aria-pressed="true"]::before { background: var(--done); border-color: var(--done); box-shadow: inset 0 0 0 3px var(--done-soft); }
.btn:disabled { opacity: .55; cursor: default; }
.fila { display: flex; flex-wrap: wrap; gap: 8px; }

details.plec > summary { cursor: pointer; font-weight: 600; min-height: 32px; display: flex; align-items: center; gap: 8px; list-style: none; }
details.plec > summary::-webkit-details-marker { display: none; }
details.plec > summary::before { content: ""; border-left: 7px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .15s; }
details.plec[open] > summary::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { details.plec > summary::before { transition: none; } }
.frases { list-style: none; margin: 4px 0 0; padding: 0; display: grid; }
.frase { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.frase-text { min-width: 0; display: grid; gap: 1px; }
.frase .ca { font-size: 20px; line-height: 1.3; font-weight: 600; }
.frase .zh { font-size: 15px; color: var(--ink-2); }
.frase .resp { font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
.frase .resp .ca { font-size: 17px; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.play.petit { width: 30px; height: 30px; }
.play svg { width: 16px; height: 16px; }
.play.sona { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.etiqueta { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.bloc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; }
.bloc h2 { font-size: 24px; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.checklist li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.check { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line-strong); background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; }
.check svg { width: 16px; height: 16px; }
.check[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--on-done); }

/* Setmana */
.linia { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.linia::before { content: ""; position: absolute; left: 7%; right: 7%; top: 19px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.estacio { position: relative; display: grid; justify-items: center; gap: 4px; border: 0; background: none; padding: 0; cursor: pointer; }
.estacio:disabled { cursor: default; }
.estacio .punt-e { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.estacio.parcial .punt-e { border-color: var(--done); }
.estacio.fet .punt-e { background: var(--seal); border-color: var(--seal); color: var(--on-seal); border-radius: 7px; transform: rotate(-6deg); font-family: var(--f-zh); font-size: 18px; }
.estacio .nom { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
.estacio.avui .nom { color: var(--seal); }
.dies { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dia-fila { width: 100%; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-align: left; }
.dia-fila:disabled { cursor: default; opacity: .7; }
.dia-fila.avui { border-color: var(--ink); }
.dia-fila .data { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.1; }
.dia-fila .tema { font-weight: 600; }
.dia-fila .sub { font-size: 14px; color: var(--muted); }
.chip { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-strong); white-space: nowrap; }
.chip.fet { background: var(--seal); color: var(--on-seal); border-color: var(--seal); font-family: var(--f-zh); }

/* Progrés */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 520px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.kpi .label { font-size: 14px; color: var(--ink-2); }
.kpi .valor { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1.05; }
.kpi .valor small { font-size: 18px; color: var(--muted); font-weight: 600; }
.kpi .peu { font-size: 13px; color: var(--muted); }
.graella { display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 5px; align-items: center; }
.graella .cap-col { font-family: var(--f-display); font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; }
.graella .cap-fila { font-family: var(--f-zh); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cel { aspect-ratio: 1; max-width: 100%; border-radius: 6px; border: 0; background: var(--heat-0); cursor: pointer; padding: 0; font-family: var(--f-zh); font-weight: 700; font-size: 15px; color: var(--on-heat-4); }
.cel.n1 { background: var(--heat-1); } .cel.n2 { background: var(--heat-2); } .cel.n3 { background: var(--heat-3); } .cel.n4 { background: var(--heat-4); }
.cel.futur { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); cursor: default; }
.cel.avui { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.cel.sel { outline: 3px solid var(--focus); outline-offset: 2px; }
.llegenda { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.llegenda span { display: inline-flex; align-items: center; gap: 5px; }
.llegenda i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.taula-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); }
.costat { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.costat li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; }
.costat .ca { font-weight: 600; }
.costat .zh { font-size: 14px; color: var(--muted); }
.copia textarea { width: 100%; min-height: 80px; font: 12px/1.4 ui-monospace, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }

/* Repàs */
.targeta { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; display: grid; gap: 12px; justify-items: center; text-align: center; min-height: 300px; align-content: center; }
.targeta .zh { font-size: 32px; line-height: 1.3; font-weight: 600; }
.targeta .zh.petit { font-size: 18px; font-weight: 400; color: var(--ink-2); }
.targeta .ca { font-size: 34px; line-height: 1.2; font-weight: 700; }
.targeta .resp { display: grid; gap: 4px; justify-items: center; padding-top: 10px; border-top: 1px dashed var(--line-strong); width: 100%; }
.targeta .resp .ca { font-size: 24px; }
.targeta .resp .zh { font-size: 16px; font-weight: 400; color: var(--ink-2); }
.play.gran { width: 64px; height: 64px; }
.play.gran svg { width: 26px; height: 26px; }
.glossa { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; }
.frase .glossa, .esc .glossa { justify-content: flex-start; margin-top: 2px; }
.mot { display: grid; justify-items: center; line-height: 1.25; }
.mot .ca { font-size: 15px !important; font-weight: 600 !important; }
.mot .zh { font-size: 12px !important; color: var(--muted) !important; font-weight: 400 !important; }
.esc, .lect { display: grid; gap: 12px; min-width: 0; }
.esc h3, .lect h3 { margin: 0; font-size: 20px; }
.esc .btn, .lect .btn { justify-self: start; }
.esc-play { display: flex; align-items: center; gap: 12px; }
.esc-preg { font-weight: 600; margin: 0; }
.esc-ops { display: grid; gap: 8px; }
.esc .esc-ops .btn { justify-self: stretch; text-align: left; }
.btn.ok, .btn.ok:disabled { border-color: var(--done); color: var(--done); opacity: 1; }
.btn.ko, .btn.ko:disabled { border-color: var(--seal); color: var(--seal); opacity: 1; }
.esc-ca { font-size: 22px; font-weight: 700; margin: 0; }
.esc-zh { font-size: 16px; color: var(--ink-2); margin: 0; }
.hist { font-size: 22px; line-height: 1.75; }
.hist p { margin: 0 0 12px; }
.hist .signe { color: var(--ink-2); }
.hist .g { white-space: nowrap; display: inline-block; }
.m { border: 0; background: none; color: inherit; font: inherit; line-height: inherit; padding: 0 1px; margin: 0; cursor: pointer; border-radius: 4px; display: inline-block; }
.m.nova { text-decoration: underline dotted var(--ink-2); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.m[aria-pressed="true"] { background: var(--surface-2); }
.full { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(528px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
.full-cap { display: flex; align-items: baseline; gap: 10px; }
.full-cap .ca { font-size: 26px; line-height: 1.2; font-weight: 700; }
.full-x { margin-left: auto; align-self: flex-start; width: 36px; height: 36px; border: 0; background: none; color: var(--ink-2); font-size: 24px; line-height: 1; cursor: pointer; }
.full-zh { margin: 0; font-size: 20px; font-weight: 600; }
.full-frase { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 8px; }
.full-frase .play { flex: none; }
.respostes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.respostes .btn { min-height: 56px; }
.btn.be { background: var(--done); border-color: var(--done); color: var(--on-done); }

/* Navegació inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.nav button { display: grid; justify-items: center; gap: 2px; padding: 8px 0 10px; border: 0; background: none; cursor: pointer; color: var(--muted); font-family: var(--f-zh); font-weight: 600; font-size: 12px; }
.nav button[aria-current="page"] { color: var(--seal); }
.nav svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="app">
  <main>
    <section class="vista" id="v-avui" aria-label="今天"></section>
    <section class="vista" id="v-repas" aria-label="复习" hidden></section>
    <section class="vista" id="v-setmana" aria-label="本周" hidden></section>
    <section class="vista" id="v-progres" aria-label="进度" hidden></section>
  </main>
</div>
<nav class="nav" aria-label="页面"><div class="nav-in" id="nav"></div></nav>

<script>

const SETMANA_DIES = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const sumaDies = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diesEntre = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const avui = () => iso(new Date());
const llarg = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日 ${SETMANA_DIES[d.getDay()]}`; };
const curt = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

// ---------- Estat (es desa en aquest mòbil) ----------
function carrega() {
  try { const e = JSON.parse(localStorage.getItem(CLAU)); if (e && e.inici) return e; } catch (_) {}
  return { inici: avui(), srs: {}, registre: [], dies: {}, config: {} };
}
const E = carrega();
function desa() { try { localStorage.setItem(CLAU, JSON.stringify(E)); } catch (_) {} }
desa();

const BLOCS = ["anki", "escolta", "lectura"];
const NOM = { anki: "复习卡片", escolta: "听力", lectura: "故事" };
const MINUTS = { anki: 10, escolta: 10, lectura: 10 };

const S = { vista: "avui", data: avui(), sessio: null, celSel: null };
const totsDies = () => SETMANES.flatMap(w => w.dies.map(dia => ({ w, dia })));
const dataDe = n => sumaDies(E.inici, n - 1);
const infoDe = data => { const n = diesEntre(E.inici, data) + 1; return totsDies().find(x => x.dia.n === n) || null; };
const primerDia = () => E.inici;
const darrerDia = () => dataDe(totsDies().length);
const nouLog = () => ({ blocs: {} });
const compta = log => !!(log && (log.blocs?.anki || log.minim));
function fetsDe(data) {
  const info = infoDe(data), log = E.dies[data];
  if (!info) return { fets: 0, total: 0 };
  return { fets: BLOCS.filter(b => log?.blocs?.[b]).length, total: BLOCS.length };
}
function patchLog(data, fn) {
  const log = E.dies[data] ? structuredClone(E.dies[data]) : nouLog();
  log.blocs = { ...(log.blocs || {}) };
  fn(log);
  E.dies[data] = log;
  desa();
  refresca(false);
}

// ---------- Àudio ----------
const reproductor = new Audio();
reproductor.preload = "auto";
let botoSonant = null;
reproductor.addEventListener("ended", () => botoSonant?.classList.remove("sona"));
let fiTram = null;
reproductor.addEventListener("timeupdate", () => {
  if (fiTram != null && reproductor.currentTime >= fiTram) { reproductor.pause(); fiTram = null; botoSonant?.classList.remove("sona"); botoSonant = null; }
});
// Reprodueix només un tros d'un fitxer: una frase dins de la pista sencera
function sonaTram(src, tram, boto) {
  botoSonant?.classList.remove("sona");
  if (botoSonant === boto && !reproductor.paused) { reproductor.pause(); botoSonant = null; fiTram = null; return; }
  const abs = new URL(src, location.href).href;
  const situa = () => { reproductor.currentTime = tram[0]; fiTram = tram[1]; };
  if (reproductor.src === abs && reproductor.readyState >= 1) situa();
  else { fiTram = null; reproductor.src = abs; reproductor.addEventListener("loadedmetadata", situa, { once: true }); }
  reproductor.play().catch(() => {});
  botoSonant = boto;
  boto?.classList.add("sona");
}
function sona(src, boto) {
  fiTram = null;
  botoSonant?.classList.remove("sona");
  if (botoSonant === boto && !reproductor.paused) { reproductor.pause(); botoSonant = null; return; }
  reproductor.src = src;
  reproductor.play().catch(() => {});
  botoSonant = boto;
  boto?.classList.add("sona");
}
const botoPlay = (src, etiqueta, petit) => src
  ? h("button", { class: "play" + (petit ? " petit" : ""), "aria-label": "播放：" + etiqueta, svg: SVG.play, onclick: e => sona(src, e.currentTarget) })
  : h("span");
const audios = {};
function audioEl(src, clau) {
  const k = clau + "|" + src;
  return audios[k] ||= h("audio", { controls: true, preload: "none", src });
}

// Traducció paraula per paraula: la paraula catalana i, a sota, què vol dir

function ginyEscena(data, dia) {

  const anar = n => { pas = n; vista = false; pinta(); if (n > 0 && n < 4) sonaPrimer(); };
  const titol = (n, t) => h("h3", null, n ? `${n} / 3 · ${t}` : t);

        triada != null ? h("button", { class: "btn primari", onclick: () => { cua = e.linies.map((_, i) => i); fetes = 0; anar(2); } }, "现在一句一句听") : null];
    },
    () => {
      const l = e.linies[cua[0]];

            h("button", { class: "btn", onclick: () => { fallades.add(cua[0]); cua.push(cua.shift()); vista = false; pinta(); sonaPrimer(); } }, "没听懂"),
            h("button", { class: "btn primari", onclick: () => { cua.shift(); fetes++; vista = false; if (cua.length) { pinta(); sonaPrimer(); } else anar(3); } }, "听懂了"))]
        : h("button", { class: "btn primari", onclick: () => { vista = true; pinta(); } }, "看看说了什么")];
    },
    () => [titol(3, "再听一次整段"), h("p", null, "不看文字。感受一下，比第一次多听懂了多少。"),
      h("div", { class: "esc-play" }, botoGran(tot, "播放整段对话")),
      h("button", { class: "btn primari", onclick: () => {

function ginyLectura(data, dia) {
  const r = dia.historia;
  const full = h("div", { class: "full", role: "dialog", "aria-label": "意思", hidden: true });
  const text = h("div", { class: "hist", lang: "ca" });
  const reproductorHist = audioEl(r.audio, "hist");
  let marcat = null;
  const tanca = () => { full.hidden = true; marcat?.setAttribute("aria-pressed", "false"); marcat = null; };
  function obre(boto, m, f) {
    if (marcat === boto) return tanca();
    marcat?.setAttribute("aria-pressed", "false");
    marcat = boto; boto.setAttribute("aria-pressed", "true");
    posa(full,
      h("div", { class: "full-cap" }, h("span", { class: "ca", lang: "ca" }, m[0]),
        h("button", { class: "full-x", "aria-label": "关闭", onclick: tanca }, "×")),
      h("p", { class: "full-zh" }, m[1]),
      h("div", { class: "full-frase" },
        h("button", { class: "play petit", "aria-label": "播放这一句", svg: SVG.play, onclick: e => { reproductorHist.pause(); sonaTram(r.audio, f.t, e.currentTarget); } }),
        h("span", null, f.zh)));
    full.hidden = false;
  }
  const paragrafs = [];
  for (const f of r.frases) {
    if (f.par || !paragrafs.length) paragrafs.push([]);
    // Els signes van enganxats a la paraula: cap línia no comença amb un signe
    let grup = null, obertura = "";
    for (const m of f.mots) {
      if (m.length === 1) {
        const obre_ = m[0].replace(/[^«¿¡“(]/g, ""), tanca_ = m[0].replace(/[«¿¡“(]/g, "");
        if (tanca_ && grup) grup.append(h("span", { class: "signe" }, tanca_));
        obertura += obre_;
        continue;
      }
      grup = h("span", { class: "g" }, obertura ? h("span", { class: "signe" }, obertura) : null,
        h("button", { class: "m" + (m[2] ? " nova" : ""), "aria-pressed": "false", onclick: e => obre(e.currentTarget, m, f) }, m[0]));
      obertura = "";
      paragrafs.at(-1).push(grup, " ");

  }
  posa(text, paragrafs.map(p => h("p", null, p)));
  return h("div", { class: "lect" },
    h("h3", { lang: "ca" }, r.titol),
    r.noves.length ? h("details", { class: "plec", open: true }, h("summary", null, `${r.noves.length} 个新词`), llistaNoves(r.noves)) : null,
    h("p", { class: "estat" }, "点任何一个词，就能看到意思和整句的中文。"),

      h("button", { class: "btn primari", onclick: () => { tanca(); patchLog(data, l => { l.blocs.lectura = true; }); } }, "读完了")),
    full);
}

// ---------- Vista: Avui ----------
function canviaDia(n) { S.data = sumaDies(S.data, n); refresca(true); }

function capcalera(info) {
  let titol = "还没有内容";
  if (info) titol = info.dia.tema;
  else if (S.data < primerDia()) titol = "还没开始";
  else if (S.data > darrerDia()) titol = "新内容快来了";
  return h("header", { class: "cap" },
    h("div", { class: "cap-nav" },
      h("button", { class: "icona-btn", "aria-label": "前一天", disabled: S.data <= primerDia(), onclick: () => canviaDia(-1) }, "‹"),
      h("span", { class: "eyebrow" }, llarg(S.data)),
      h("button", { class: "icona-btn", "aria-label": "后一天", disabled: S.data >= darrerDia(), onclick: () => canviaDia(1) }, "›")),
    h("div", { class: "cap-titol" },
      h("h1", null, titol),
      info ? h("div", { class: "segell", id: "segell", "aria-label": "今天完成了", hidden: true }, "完成") : null),
    info ? h("p", { class: "meta" }, `第${info.w.num}周 · 第${info.dia.n}天${S.data === avui() ? " · 今天" : ""}`) : null,
    info ? h("div", { class: "barra", id: "barra", "aria-hidden": "true" }, BLOCS.map(b => h("span", { "data-b": b }))) : null,
    info ? h("p", { class: "estat", id: "progres-text" }) : null,
    S.data !== avui() ? h("div", null, h("button", { class: "btn", onclick: () => { S.data = avui(); refresca(true); } }, "回到今天")) : null);
}

function cosBloc(b, info, data) {
  const { dia } = info;
  switch (b) {
    case "anki": {
      const { repassos, noves } = cua();
      const pendents = data === avui() ? `今天有 ${repassos.length} 张复习、${noves.length} 张新卡片。` : "";
      return [
        h("p", null, pendents + "翻卡片之前，先用加泰罗尼亚语大声说出来。"),
        data === avui() ? h("div", null, h("button", { class: "btn primari", onclick: () => mostra("repas") }, "打开复习")) : null,
        h("details", { class: "plec" }, h("summary", null, `这一天的 ${dia.frases.length} 个句子`), llistaFrases(dia.frases))];
    }
    case "escolta": return [ginyDe(data + "|e", () => ginyEscena(data, dia))];
    case "lectura": return [ginyDe(data + "|h", () => ginyLectura(data, dia))];
  }
  return [];
}

function buildAvui() {
  const root = $("#v-avui");
  const info = infoDe(S.data);
  if (!info) return posa(root, capcalera(null),
    h("p", null, S.data > darrerDia() ? "这两周的内容都在这里了。新的内容很快就会加上，同一个链接打开就有。" : ""));
  posa(root,
    capcalera(info),
    h("ol", { class: "ruta" }, BLOCS.map(b => h("li", { class: "parada", "data-b": b },
      h("button", { class: "punt", "aria-pressed": "false", "aria-label": `${NOM[b]}：完成`, svg: SVG.check, onclick: () => patchLog(S.data, l => { l.blocs[b] = !l.blocs[b]; }) }),
      h("div", { class: "parada-cos" },
        h("div", { class: "parada-cap" }, h("h2", null, NOM[b]), h("span", { class: "min" }, MINUTS[b] + " 分钟")),
        cosBloc(b, info, S.data))))),
    h("div", { class: "bloc" },
      h("button", { class: "btn toggle", id: "b-minim", "aria-pressed": "false", onclick: () => patchLog(S.data, l => { l.minim = !l.minim; }) }, "今天只能做最少的"),
      h("p", { class: "estat" }, "最少：复习卡片 5 分钟。这样连续天数不会断。")));
  syncAvui(false);
}
function syncAvui(animar = true) {
  const root = $("#v-avui");
  if (!infoDe(S.data)) return;
  const log = E.dies[S.data] || {};
  let fets = 0;
  for (const b of BLOCS) {
    const on = !!log.blocs?.[b];
    if (on) fets++;
    const li = root.querySelector(`.parada[data-b="${b}"]`);
    if (li) { li.classList.toggle("fet", on); li.querySelector(".punt").setAttribute("aria-pressed", String(on)); }
    root.querySelector(`#barra [data-b="${b}"]`)?.classList.toggle("fet", on);
  }
  const segell = $("#segell");
  if (segell) {
    const complet = fets === BLOCS.length;
    if (complet && segell.hidden && animar) segell.classList.add("estampa");
    if (!complet) segell.classList.remove("estampa");
    segell.hidden = !complet;
  }
  const pt = $("#progres-text");
  if (pt) pt.textContent = fets === BLOCS.length ? "今天全部完成了。" : `完成了 ${fets} / ${BLOCS.length} 站`;
  $("#b-minim")?.setAttribute("aria-pressed", String(!!log.minim));
}

// ---------- Repàs: repetició espaiada FSRS-6, igual que al hub ----------
// «No» la torna a mostrar en aquesta sessió. Cada resposta es guarda al registre per ajustar els paràmetres més endavant.
const NOVES_DIA = 6;
const RETENCIO = 0.9;
const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
  1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const DECAY = -W[20], FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
const clampD = d => Math.min(10, Math.max(1, d));
const d0 = g => clampD(W[4] - Math.exp(W[5] * (g - 1)) + 1);
const recuperabilitat = (dies, s) => Math.pow(1 + FACTOR * dies / s, DECAY);
const interval = s => Math.min(365, Math.max(1, Math.round(s / FACTOR * (Math.pow(RETENCIO, 1 / DECAY) - 1))));
function fsrs(e, g, t) {
  if (e.s == null) return { s: W[g - 1], d: d0(g) };
  const dies = diesEntre(e.last, t);
  let s;
  if (dies <= 0) {
    s = e.s * Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(e.s, -W[19]);
    if (g >= 3) s = Math.max(s, e.s);
  } else {
    const r = recuperabilitat(dies, e.s);
    s = g === 1
      ? Math.min(W[11] * Math.pow(e.d, -W[12]) * (Math.pow(e.s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)), e.s / Math.exp(W[17] * W[18]))
      : e.s * (1 + Math.exp(W[8]) * (11 - e.d) * Math.pow(e.s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1));
  }
  const dp = e.d - W[6] * (g - 3) * (10 - e.d) / 9;
  return { s: Math.max(0.01, s), d: clampD(W[7] * d0(4) + (1 - W[7]) * dp) };
}
function idTargeta(f) {
  let x = 5381;
  for (const ch of f.t + f.ca) x = ((x << 5) + x + ch.codePointAt(0)) >>> 0;
  return "c" + x.toString(36);
}
function totesTargetes() {
  const t = avui(), out = [];
  for (const { dia } of totsDies()) if (dataDe(dia.n) <= t)
    for (const f of dia.frases) out.push({ id: idTargeta(f), f });
  return out;
}
const estatDe = c => E.srs[c.id];
function cua() {
  const t = avui(), totes = totesTargetes();
  const repassos = totes.filter(c => estatDe(c)?.due <= t).sort((a, b) => estatDe(a).due.localeCompare(estatDe(b).due));
  const avuiIntroduides = totes.filter(c => estatDe(c)?.intro === t).length;
  const noves = totes.filter(c => !estatDe(c)).slice(0, Math.max(0, NOVES_DIA - avuiIntroduides));
  return { repassos, noves };
}
function comencaRepas() {
  const { repassos, noves } = cua();
  S.sessio = { cua: [...repassos.map(c => ({ c })), ...noves.map(c => ({ c, nova: true }))], girada: false, fetes: 0 };
  renderRepas();
  sonaFront();
}
function sonaFront() {
  const it = S.sessio?.cua[0];
  if (it && it.c.f.t === "E") { const b = $("#repas-play"); if (b) sona(it.c.f.so, b); }
}
function gira() {
  S.sessio.girada = true;
  renderRepas();
  const f = S.sessio.cua[0].c.f;
  const b = $("#repas-play");
  if (b && f.t === "D") sona(f.so, b);
}
function respon(bona) {
  const s = S.sessio, item = s.cua.shift(), c = item.c, t = avui();
  const anterior = estatDe(c);
  const e = { reps: 0, lapses: 0, intro: t, ...(anterior || {}) };
  const g = bona ? 3 : 1;
  const transcorregut = anterior?.last ? diesEntre(anterior.last, t) : -1;
  Object.assign(e, fsrs(e, g, t));
  e.last = t;
  if (bona) {
    let ivl = interval(e.s);
    if (ivl >= 3) ivl = Math.max(2, Math.round(ivl * (0.95 + Math.random() * 0.1)));   // petit desordre perquè no s'amunteguin
    e.ivl = ivl;
    e.reps++;
  } else {
    if (transcorregut > 0) e.lapses++;
    e.ivl = 0;
    s.cua.splice(Math.min(4, s.cua.length), 0, { c });
  }
  e.s = +e.s.toFixed(3); e.d = +e.d.toFixed(3);
  e.due = sumaDies(t, e.ivl);
  E.srs[c.id] = e;
  E.registre = [...(E.registre || []), [c.id, t, g, transcorregut]].slice(-4000);
  desa();
  s.fetes++;
  s.girada = false;
  if (!s.cua.length && infoDe(t) && !E.dies[t]?.blocs?.anki) patchLog(t, l => { l.blocs.anki = true; });
  renderRepas();
  sonaFront();
}
function renderRepas() {
  const root = $("#v-repas");
  const cap = h("header", { class: "cap" }, h("p", { class: "eyebrow" }, llarg(avui())), h("h1", null, "复习卡片"));
  const s = S.sessio;
  if (!s || !s.cua.length) {
    const { repassos, noves } = cua();
    const res = !repassos.length && !noves.length;
    return posa(root, cap,
      s?.fetes ? h("div", { class: "bloc" }, h("span", { class: "eyebrow" }, "完成"), h("p", null, `复习了 ${s.fetes} 张卡片。今天的复习已经打勾了。`)) : null,
      h("div", { class: "bloc" },
        h("p", null, res ? "现在没有要复习的卡片。明天还有新的。"
          : `你有 ${repassos.length} 张复习、${noves.length} 张新卡片。`),
        h("p", { class: "estat" }, "看到中文：先用加泰罗尼亚语大声说出来，再翻卡片。听到加泰罗尼亚语：想一想是什么意思，你会怎么回答。"),
        h("p", { class: "estat" }, "新卡片你还不会，没关系：先想一想，再翻过来，跟着录音说两遍。"),
        res ? null : h("div", null, h("button", { class: "btn primari", onclick: comencaRepas }, "开始复习"))));
  }
  const f = s.cua[0].c.f, dir = f.t === "D";
  posa(root, cap,
    h("p", { class: "estat" }, `已完成 ${s.fetes} · 还剩 ${s.cua.length}${s.cua[0].nova ? " · 新卡片" : ""}`),
    h("div", { class: "targeta" },
      h("span", { class: "etiqueta" }, dir ? "用加泰罗尼亚语大声说出来" : "对方说了什么？"),
      dir ? h("p", { class: "zh" + (s.girada ? " petit" : "") }, f.zh) : null,
      (!dir || s.girada) ? h("button", { class: "play gran", id: "repas-play", "aria-label": "播放", svg: SVG.play, onclick: e => sona(f.so, e.currentTarget) }) : null,
      s.girada ? [
        h("span", { class: "ca", lang: "ca" }, f.ca),
        glossa(f.mots),
        dir ? null : h("p", { class: "zh petit" }, f.zh),
        f.resp ? h("div", { class: "resp" }, h("span", { class: "etiqueta" }, "回答"), h("span", { class: "ca", lang: "ca" }, f.resp),
          h("span", { class: "zh" }, f.resp_zh), botoPlay(f.resp_so, f.resp, true)) : null,
        dir ? h("p", { class: "estat" }, "模仿录音，大声说两遍。") : null] : null),
    s.girada
      ? h("div", { class: "respostes" },
        h("button", { class: "btn", onclick: () => respon(false) }, dir ? "没说出来" : "没听懂"),
        h("button", { class: "btn be", onclick: () => respon(true) }, dir ? "说对了" : "听懂了"))
      : h("button", { class: "btn primari", style: "min-height:56px", onclick: gira }, "翻卡片"),
    h("div", null, h("button", { class: "btn", onclick: () => { S.sessio = null; reproductor.pause(); renderRepas(); } }, "先到这里")));
}

// ---------- Vista: Setmana ----------
let setmanaSel = null;
function setmanaVisible() {
  if (setmanaSel != null) return SETMANES[setmanaSel];
  const n = diesEntre(E.inici, avui()) + 1;
  return SETMANES.find(w => w.dies.some(d => d.n === n)) || (n < 1 ? SETMANES[0] : SETMANES.at(-1));
}
function renderSetmana() {
  const root = $("#v-setmana");
  const w = setmanaVisible(), i = SETMANES.indexOf(w);
  const t = avui();
  const rang = `${curt(dataDe(w.dies[0].n))} – ${curt(dataDe(w.dies.at(-1).n))}`;
  const obre = d => { S.data = d; mostra("avui"); };
  posa(root,
    h("header", { class: "cap" },
      h("div", { class: "cap-nav" },
        h("button", { class: "icona-btn", "aria-label": "上一周", disabled: i <= 0, onclick: () => { setmanaSel = i - 1; renderSetmana(); } }, "‹"),
        h("span", { class: "eyebrow" }, `第${w.num}周 · ${rang}`),
        h("button", { class: "icona-btn", "aria-label": "下一周", disabled: i >= SETMANES.length - 1, onclick: () => { setmanaSel = i + 1; renderSetmana(); } }, "›")),
      h("h1", null, w.titol.replace(/^第.周：/, ""))),
    h("div", { class: "linia", role: "list" }, w.dies.map(d => {
      const data = dataDe(d.n);
      const { fets, total } = fetsDe(data);
      const estat = fets === total && total ? "fet" : fets ? "parcial" : "";
      return h("button", { class: `estacio ${estat}${data === t ? " avui" : ""}`, role: "listitem", "aria-label": `${llarg(data)}：${d.tema}，完成 ${fets}/${total}`, onclick: () => obre(data) },
        h("span", { class: "punt-e" }, estat === "fet" ? "完" : String(parse(data).getDate())),
        h("span", { class: "nom" }, SETMANA_DIES[parse(data).getDay()].slice(-1)));
    })),
    h("ul", { class: "dies" }, w.dies.map(d => {
      const data = dataDe(d.n);
      const { fets, total } = fetsDe(data);
      const passat = data <= t;
      return h("li", null, h("button", { class: "dia-fila" + (data === t ? " avui" : ""), onclick: () => obre(data) },
        h("span", { class: "data" }, `${curt(data)}`, h("br"), SETMANA_DIES[parse(data).getDay()]),
        h("span", { style: "min-width:0;display:grid" }, h("span", { class: "tema" }, d.tema), h("span", { class: "sub" }, `${d.escena.titol} · ${d.historia.titol}`)),
        fets === total && total ? h("span", { class: "chip fet" }, "完成") : passat || fets ? h("span", { class: "chip" }, `${fets}/${total}`) : h("span")));
    })));
}

// ---------- Vista: Progrés ----------
function estadistiques() {
  const t = avui();
  const dies = totsDies().map(x => dataDe(x.dia.n)).filter(d => d <= t);
  let complets = 0, ok = 0, total = 0;
  for (const d of dies) {
    const { fets, total: tt } = fetsDe(d);
    if (tt && fets === tt) complets++;
    const es = E.dies[d]?.escolta;
    if (es) { ok += es.ok; total += es.total; }
  }
  let ratxa = 0, d = t;
  if (!compta(E.dies[d])) d = sumaDies(d, -1);
  while (compta(E.dies[d])) { ratxa++; d = sumaDies(d, -1); }
  return { dies: dies.length, complets, ratxa, frases: totesTargetes().filter(estatDe).length,
    repassos: (E.registre || []).length, escolta: total ? Math.round(100 * ok / total) : null };
}
const nivell = (fets, total) => !total || !fets ? 0 : fets === total ? 4 : fets / total <= 1 / 3 ? 1 : fets / total <= 2 / 3 ? 2 : 3;
function renderProgres() {
  const root = $("#v-progres");
  const st = estadistiques();
  const t = avui();
  const kpi = (label, valor, unitat, peu) => h("div", { class: "kpi" },
    h("span", { class: "label" }, label),
    h("span", { class: "valor" }, valor, unitat ? h("small", null, " " + unitat) : null),
    peu ? h("span", { class: "peu" }, peu) : null);
  const detall = h("div", { class: "bloc", id: "detall", hidden: true });
  const mostraDetall = d => {
    S.celSel = d;
    root.querySelectorAll(".cel").forEach(c => c.classList.toggle("sel", c.dataset.d === d));
    const { fets, total } = fetsDe(d), es = E.dies[d]?.escolta;
    detall.hidden = false;
    detall.replaceChildren(
      h("span", { class: "eyebrow" }, llarg(d)),
      h("p", null, `${infoDe(d)?.dia.tema || ""} · 完成 ${fets}/${total}${es ? ` · 听力 ${es.ok}/${es.total}` : ""}`),
      h("div", null, h("button", { class: "btn", onclick: () => { S.data = d; mostra("avui"); } }, "打开这一天")));
  };
  // Les frases que més li costen: les que ha fallat més vegades
  const totes = totesTargetes();
  const fallades = {};
  for (const [id, , g] of E.registre || []) if (g === 1) fallades[id] = (fallades[id] || 0) + 1;
  const dificils = totes.filter(c => fallades[c.id]).sort((a, b) => fallades[b.id] - fallades[a.id]).slice(0, 8);
  const perSetmana = SETMANES.filter(w => dataDe(w.dies[0].n) <= t).map(w => {
    let complets = 0, frases = 0, ok = 0, total = 0;
    for (const dia of w.dies) {
      const data = dataDe(dia.n);
      if (data > t) continue;
      const { fets, total: tt } = fetsDe(data), log = E.dies[data] || {};
      if (tt && fets === tt) complets++;
      if (log.blocs?.anki) frases += dia.frases.length;
      if (log.escolta) { ok += log.escolta.ok; total += log.escolta.total; }
    }
    return { w, complets, frases, escolta: total ? Math.round(100 * ok / total) + "%" : "—" };
  }).reverse();
  posa(root,
    h("header", { class: "cap" }, h("p", { class: "eyebrow" }, "进度"), h("h1", null, "你的成绩")),
    h("div", { class: "kpis" },
      kpi("连续天数", String(st.ratxa), "天", "每天都复习了卡片"),
      kpi("完成的天数", String(st.complets), `/ ${st.dies}`, "三站都完成"),
      kpi("学过的句子", String(st.frases), null, "已经见过的卡片"),
      kpi("听力", st.escolta == null ? "—" : String(st.escolta), st.escolta == null ? null : "%", "第一次就听懂的句子"),
      kpi("复习次数", String(st.repassos), null, "一共翻了多少次卡片")),
    perSetmana.length ? h("section", { class: "bloc" },
      h("h2", null, "每一周"),
      h("div", { class: "taula-wrap" }, h("table", null,
        h("thead", null, h("tr", null, ["周", "完成的天数", "句子", "听力"].map(x => h("th", { scope: "col" }, x)))),
        h("tbody", null, perSetmana.map(s => h("tr", null,
          h("td", null, `第${s.w.num}周`), h("td", null, `${s.complets}/7`), h("td", null, String(s.frases)), h("td", null, s.escolta))))))) : null,
    h("section", { class: "bloc" },
      h("h2", null, "每一天"),
      h("div", { class: "graella" },
        h("span"), [1, 2, 3, 4, 5, 6, 7].map(x => h("span", { class: "cap-col" }, String(x))),
        SETMANES.map(w => [h("span", { class: "cap-fila" }, `${w.num}周`), w.dies.map(dia => {
          const data = dataDe(dia.n);
          const { fets, total } = fetsDe(data);
          const futur = data > t;
          const n = futur ? 0 : nivell(fets, total);
          return h("button", { class: `cel n${n}${futur ? " futur" : ""}${data === t ? " avui" : ""}${S.celSel === data ? " sel" : ""}`, "data-d": data,
            disabled: futur, "aria-label": `${llarg(data)}：${futur ? "还没到" : `完成 ${fets}/${total}`}`,
            onclick: () => mostraDetall(data) }, n === 4 ? "完" : "");
        })])),
      h("div", { class: "llegenda", "aria-hidden": "true" },
        [["0", "没做"], ["1", "一点"], ["2", "一半"], ["3", "差不多"], ["4", "完成"]].map(([k, x]) =>
          h("span", null, h("i", { style: `background:var(--heat-${k})` }), x))),
      detall),
    h("section", { class: "bloc" },
      h("h2", null, "最难的句子"),
      dificils.length ? h("ul", { class: "costat" }, dificils.map(c => h("li", null,
        botoPlay(c.f.so, c.f.ca, true),
        h("span", { style: "display:grid;min-width:0" }, h("span", { class: "ca", lang: "ca" }, c.f.ca), h("span", { class: "zh" }, `${c.f.zh} · 错了 ${fallades[c.id]} 次`)))))
        : h("p", { class: "estat" }, "复习时没说出来的句子会出现在这里。")),
    copia());
  if (S.celSel) mostraDetall(S.celSel);
}
// Còpia de seguretat del progrés: copiar el codi i enganxar-lo si canvia de mòbil o de navegador
function copia() {
  const codi = () => btoa(unescape(encodeURIComponent(JSON.stringify(E))));
  const area = h("textarea", { readonly: true, "aria-label": "进度代码" });
  const entrada = h("textarea", { placeholder: "把之前复制的代码粘贴到这里", "aria-label": "粘贴进度代码" });
  return h("details", { class: "plec copia", ontoggle: () => { area.value = codi(); } },
    h("summary", null, "备份进度"),
    h("p", { class: "estat", style: "margin:8px 0" }, "进度只保存在这个手机上。换手机或换浏览器之前，复制这段代码发给自己，然后在新的地方粘贴回来。"),
    area,
    h("div", { class: "fila", style: "margin:8px 0 16px" }, h("button", { class: "btn", onclick: async ev => {
      area.select(); try { await navigator.clipboard.writeText(area.value); } catch (_) { document.execCommand?.("copy"); }
      ev.currentTarget.textContent = "已复制";
    } }, "复制代码")),
    entrada,
    h("div", { class: "fila", style: "margin-top:8px" }, h("button", { class: "btn", onclick: () => {
      try {
        const nou = JSON.parse(decodeURIComponent(escape(atob(entrada.value.trim()))));
        if (!nou.inici || !nou.srs) throw 0;
        Object.keys(E).forEach(k => delete E[k]); Object.assign(E, nou); desa();
        S.sessio = null; for (const k in ginys) delete ginys[k];
        mostra("avui");
      } catch (_) { alert("代码不对，请重新复制。"); }
    } }, "恢复进度")));
}

// ---------- Estructura general ----------
const VISTES = [["avui", "今天"], ["repas", "复习"], ["setmana", "本周"], ["progres", "进度"]];
function muntaNav() {
  $("#nav").replaceChildren(...VISTES.map(([v, t]) => h("button", { "data-v": v, onclick: () => mostra(v) },
    h("span", { svg: SVG[v], style: "display:grid" }), t)));
}
function mostra(v) {
  S.vista = v;
  for (const [id] of VISTES) $("#v-" + id).hidden = id !== v;
  document.querySelectorAll("#nav button").forEach(b => b.toggleAttribute("aria-current", false) || (b.dataset.v === v && b.setAttribute("aria-current", "page")));
  try { history.replaceState(null, "", "#" + v); } catch (_) {}
  refresca(true);
  window.scrollTo(0, 0);
}
let construit = null;
function refresca(estructural) {
  if (S.vista === "avui") {
    if (estructural || construit !== S.data) { construit = S.data; buildAvui(); }
    else syncAvui();
  } else if (S.vista === "repas") { if (estructural || !S.sessio) renderRepas(); }
  else if (S.vista === "setmana") renderSetmana();
  else if (S.vista === "progres") renderProgres();
}
// Si la pàgina queda oberta d'un dia per l'altre, en tornar-hi mostra el dia nou
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.data !== avui() && construit === S.data && S.vista === "avui") { S.data = avui(); refresca(true); }
});

const inicial = location.hash.slice(1);
muntaNav();
mostra(VISTES.some(([v]) => v === inicial) ? inicial : "avui");
})();
</script>
</body>
